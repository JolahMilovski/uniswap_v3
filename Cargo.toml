[package]
name = "uniswap"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = "1.0.218"
serde_json = "1.0.140"
env_logger = "0.11.6"
anyhow = "1.0.97"
#log = "0.4"
dotenv = "0.15.0"
tokio = { version = "1.44", features = ["full","tracing" ] }
ethers-middleware = "2.0.14"
ethers-providers = "2.0.14"
ethers-contract = "2.0.14"
ethers ="2.0.14"
lazy_static = "1.4"
regex = "1.11.1"
bincode = "1.3.3"
indicatif = "0.17.11"
dashmap = {version = "6.1.0", features = ["serde"] }
chrono = "0.4"
colored = "3.0.0"

governor = "0.10.0"
nonzero_ext = "0.3.0"
im = {version = "15.1.0", features = ["serde"] }
serde_with = "3.12.0"
num-traits = "0.2.19"
futures = "0.3.31"

tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
tracing-appender = "0.2.3"

arc-swap = "1.7.1"
